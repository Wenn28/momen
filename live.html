<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Momen: Live Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
  <style>
    /* Latar gelap hangat: foto paling menonjol di proyektor, warna tetap satu keluarga dengan krem */
    body { background: #14110F; color: #F4EDE4; overflow: hidden; }
    .stage { height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 20vw, 320px); grid-template-rows: auto minmax(0, 1fr) clamp(90px, 15vh, 150px); gap: 16px; padding: 20px 24px; }
    header { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    header .brand { color: #F4EDE4; }
    header .title { font-family: var(--display); font-size: clamp(22px, 2.4vw, 34px); font-weight: 600; }
    .dim { color: #B5AA9D; }
    #main { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; animation: in .6s ease; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    .info { grid-row: 2 / 4; grid-column: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; border-radius: 20px; background: #221D19; text-align: center; }
    .info .qr { width: 100%; padding: 10px; background: #fff; border-radius: 14px; }
    .info .qr svg { display: block; width: 100%; height: auto; }
    .info .code { font-family: var(--display); font-size: clamp(26px, 2.6vw, 40px); font-weight: 600; letter-spacing: 5px; }
    .info p { margin: 0; }
    .strip { display: flex; gap: 10px; overflow: hidden; }
    .strip img { height: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; flex: none; }
    .wait { display: grid; place-items: center; text-align: center; font-size: clamp(20px, 2vw, 28px); }
    /* Login: tampil terang seperti halaman Host lain */
    .login { position: fixed; inset: 0; overflow: auto; background: var(--bg); color: var(--ink); }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .stage { height: auto; grid-template-columns: 1fr; grid-template-rows: auto; }
      .info { grid-row: auto; grid-column: auto; }
      #main, .wait { height: 60vh; }
      .strip { height: 90px; }
    }
  </style>
</head>
<body>
  <!-- Belum masuk sebagai Host pemilik room -->
  <div class="login split" id="loginView" hidden>
    <main>
      <a class="brand" href="index.html">momen<span>.</span></a>
      <h1 class="display" style="font-size: 40px">Live Screen khusus Host</h1>
      <p class="msg" id="loginMsg" data-type="error"></p>
      <a class="btn btn-primary" href="host.html" style="align-self: flex-start">Masuk sebagai Host</a>
    </main>
  </div>

  <div class="stage" id="stage" hidden>
    <header>
      <div style="display: flex; align-items: baseline; gap: 16px; min-width: 0">
        <span class="brand">momen<span>.</span></span>
        <h1 class="title" id="roomName" style="margin: 0"></h1>
      </div>
      <span class="dim" id="counter" aria-live="polite">Menunggu foto</span>
    </header>

    <main style="display: contents">
      <img id="main" alt="Foto terbaru dari tamu" width="1920" height="1080" hidden>
      <div class="wait" id="wait">Menunggu foto pertama.<br><span class="dim">Scan QR di samping untuk mengirim.</span></div>
    </main>

    <aside class="info" aria-label="Cara mengirim foto">
      <div class="qr" id="qr" role="img" aria-label="Kode QR untuk mengirim foto"></div>
      <p class="dim">Scan untuk kirim foto, atau masukkan kode</p>
      <p class="code" id="code"></p>
    </aside>

    <footer class="strip" id="strip"></footer>
  </div>

  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { auth, db, $, roomParam, loadRoom, driveImg, guestUrl, qrSvg } from "./app.js";

    const code = roomParam();
    let unsubscribe = null;

    function denied(text) {
      $("stage").hidden = true;
      $("loginView").hidden = false;
      $("loginMsg").textContent = text;
    }

    // Foto terbaru (yang tidak disembunyikan) besar, 12 berikutnya di strip bawah
    function render(photos) {
      const shown = photos.filter((p) => !p.hidden);
      $("counter").textContent = shown.length ? `${shown.length} foto terbaru` : "Menunggu foto";
      $("wait").hidden = shown.length > 0;
      $("main").hidden = shown.length === 0;
      if (shown[0]) {
        const src = driveImg(shown[0].fileId, 1920);
        // Animasi masuk singkat hanya saat foto utama berganti: menandai ada kiriman baru
        if ($("main").src !== src) { $("main").src = src; $("main").style.animation = "none"; void $("main").offsetWidth; $("main").style.animation = ""; }
      }
      $("strip").replaceChildren(...shown.slice(1, 13).map((p) =>
        Object.assign(document.createElement("img"), { src: driveImg(p.fileId, 300), alt: "", width: 150, height: 150 })));
    }

    onAuthStateChanged(auth, async (user) => {
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      if (!user || user.isAnonymous) return denied("Masuk dengan akun Host pemilik room ini untuk membuka Live Screen.");
      try {
        const room = await loadRoom(code);
        if (!room) return denied("Room tidak ditemukan.");
        if (room.ownerUid !== user.uid) return denied("Room ini milik Host lain.");
        document.title = `Live: ${room.name}`;
        $("roomName").textContent = room.name;
        $("code").textContent = room.id;
        $("qr").innerHTML = qrSvg(guestUrl(code), 8);
        $("loginView").hidden = true;
        $("stage").hidden = false;
        // 30 foto terbaru; foto tersembunyi disaring di browser agar tidak butuh indeks gabungan
        const q = query(collection(db, "rooms", code, "photos"), orderBy("createdAt", "desc"), limit(30));
        unsubscribe = onSnapshot(q, (snap) => render(snap.docs.map((d) => d.data())),
          (e) => { $("wait").hidden = false; $("wait").textContent = "Gagal memuat foto: " + e.message; });
      } catch (e) {
        denied("Gagal memuat room: " + e.message);
      }
    });
  </script>
</body>
</html>
