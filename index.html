<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Momen: Gabung Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Input kode room: huruf besar berjarak agar 6 karakter mudah dibaca dan dicek ulang */
    #code { font-family: var(--display); font-size: 32px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; text-align: center; min-height: 72px; }
    .join { display: flex; flex-direction: column; gap: 16px; max-width: 440px; }
    .panel .lead { margin: 0; font-size: 17px; max-width: 30ch; }
    .panel .btn-secondary { align-self: flex-start; border-color: #fff; }
  </style>
</head>
<body>
  <div class="split">
    <!-- Kolom utama: Tamu memasukkan kode room -->
    <main>
      <header><a class="brand" href="index.html">momen<span>.</span></a></header>
      <div>
        <h1 class="display" style="font-size: clamp(38px, 5vw, 60px)">Masuk ke room, lalu <em>abadikan</em> acaranya.</h1>
        <p class="muted" style="margin: 12px 0 0; font-size: 17px; max-width: 34ch">Tanpa daftar, tanpa unduh aplikasi. Kode room ada di kartu QR atau dari tuan rumah.</p>
      </div>
      <form class="join" id="joinForm" novalidate>
        <div class="field">
          <label for="code">Kode room</label>
          <input class="input" id="code" name="code" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="K7P2QX" required>
        </div>
        <button class="btn btn-primary btn-lg" id="btnJoin" type="submit">Masuk room</button>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </form>
    </main>

    <!-- Kolom samping: jalan masuk untuk Host -->
    <aside class="panel">
      <h2 class="display" style="font-size: clamp(32px, 4vw, 48px)">Punya acara? Buat room <em>sendiri</em>.</h2>
      <p class="lead">Host membuat room, mencetak kartu QR, lalu memilih foto mana yang tampil di layar acara.</p>
      <a class="btn btn-secondary" href="host.html">Masuk sebagai Host</a>
    </aside>
  </div>

  <script type="module">
    import { $, showMsg, cleanCode, loadRoom } from "./app.js";

    // Rapikan ketikan: huruf besar, hanya huruf/angka, maks 6
    $("code").addEventListener("input", (e) => { e.target.value = cleanCode(e.target.value); });

    // Cek kode ke Firestore sebelum pindah ke halaman Tamu
    $("joinForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = cleanCode($("code").value);
      if (code.length !== 6) { showMsg($("msg"), "Kode room terdiri dari 6 huruf atau angka.", "error"); $("code").focus(); return; }
      $("btnJoin").disabled = true;
      showMsg($("msg"), "Mencari room…");
      try {
        const room = await loadRoom(code);
        if (!room) { showMsg($("msg"), `Room ${code} tidak ditemukan. Cek lagi kodenya.`, "error"); return; }
        location.href = `tamu.html?r=${code}`;
      } catch (err) {
        showMsg($("msg"), "Gagal mencari room: " + err.message, "error");
      } finally {
        $("btnJoin").disabled = false;
      }
    });
  </script>
</body>
</html>
