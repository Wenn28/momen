<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Momen: Admin</title>
  <style>
    /* Dasar: tema gelap */
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    [hidden] { display: none !important; }
    button { padding: 12px 16px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 10px; background: #f5c542; color: #111; cursor: pointer; }

    /* Form login admin */
    .login { max-width: 360px; margin: 10vh auto; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .login input { padding: 14px; font-size: 1rem; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #eee; }
    .error { color: #ff6b6b; min-height: 1.5em; margin: 0; }

    /* Dashboard: header + grid responsif */
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; }
    header h1 { margin: 0; font-size: 1.3rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 0 16px 24px; }
    .card { background: #1a1a1a; border-radius: 10px; overflow: hidden; font-size: .85rem; }
    .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; }
    .card div { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .card a { color: #f5c542; }
    .card time { color: #999; }
    .card button { padding: 6px; font-size: .85rem; background: #333; color: #eee; }
    .card.hidden img { opacity: .25; }
    .actions { display: flex; gap: 8px; }
    .actions a { padding: 12px 16px; border-radius: 10px; background: #333; color: #eee; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Layar login admin -->
  <form class="login" id="loginView" hidden>
    <h1>Admin Momen</h1>
    <input type="email" id="email" placeholder="Email admin" required autocomplete="username">
    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Masuk</button>
    <p class="error" id="loginMsg" role="alert"></p>
  </form>

  <!-- Dashboard admin -->
  <section id="adminView" hidden>
    <header>
      <h1>Foto Terbaru (<span id="total">0</span>)</h1>
      <div class="actions">
        <!-- Semua foto ada di Drive; unduh folder Acara sebagai ZIP dari sana -->
        <!-- Cari folder lewat Drive milik Admin; ID folder tidak ditaruh di kode karena foldernya dibagikan publik lewat link -->
        <a href="https://drive.google.com/drive/search?q=Momen%20type:folder" target="_blank" rel="noopener">Buka folder Drive</a>
        <button id="btnLogout">Logout</button>
      </div>
    </header>
    <p class="error" id="listMsg" style="padding: 0 16px"></p>
    <div class="grid" id="grid"></div>
  </section>

  <script type="module">
    // Import Firebase SDK modular dari CDN gstatic
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig, ADMIN_UID, EVENT_ID } from "./firebase-config.js";

    // Inisialisasi layanan Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Referensi elemen UI
    const $ = (id) => document.getElementById(id);

    let unsubscribe = null;   // penghenti listener realtime
    const cards = new Map();  // kartu per photoId, dipakai ulang antar snapshot

    // URL gambar dan download dari Google Drive (file disetel "siapa saja dengan link")
    const driveImg = (fileId) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w400`;
    const driveDownload = (fileId) => `https://drive.google.com/uc?export=download&id=${encodeURIComponent(fileId)}`;

    // Login email/password
    $("loginView").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginMsg").textContent = "";
      try {
        await signInWithEmailAndPassword(auth, $("email").value, $("password").value);
      } catch (err) {
        $("loginMsg").textContent = "Login gagal: " + err.message;
      }
    });

    // Tombol logout
    $("btnLogout").addEventListener("click", () => signOut(auth));

    // Cek status login: hanya ADMIN_UID yang boleh masuk dashboard
    onAuthStateChanged(auth, (user) => {
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      if (user && user.uid !== ADMIN_UID) {
        $("loginMsg").textContent = "Akses ditolak";
        signOut(auth);
        return;
      }
      $("loginView").hidden = !!user;
      $("adminView").hidden = !user;
      if (user) startList();
    });

    // Listener realtime: maks 500 foto, urut paling baru
    function startList() {
      const q = query(
        collection(db, "events", EVENT_ID, "photos"),
        orderBy("createdAt", "desc"),
        limit(500),
      );
      unsubscribe = onSnapshot(q, (snap) => {
        $("listMsg").textContent = "";
        $("total").textContent = snap.size;
        $("grid").replaceChildren(...snap.docs.map((d) => cardFor(d.id, d.data())));
      }, (err) => { $("listMsg").textContent = "Gagal memuat: " + err.message; });
    }

    // Buat kartu foto (sekali per photoId), lalu perbarui status sembunyi di setiap snapshot
    function cardFor(id, photo) {
      let card = cards.get(id);
      if (!card) {
        card = document.createElement("article");
        card.innerHTML = `<img loading="lazy" alt="Foto tamu"><div><a target="_blank" rel="noopener">Download</a><time></time><button type="button"></button></div>`;
        card.querySelector("img").src = driveImg(photo.fileId);
        card.querySelector("a").href = driveDownload(photo.fileId);
        card.querySelector("time").textContent = photo.createdAt ? photo.createdAt.toDate().toLocaleString("id-ID") : "";
        cards.set(id, card);
      }

      // Tombol Sembunyikan / Tampilkan lagi: ubah field hidden; Live Screen ikut berubah realtime
      const hidden = !!photo.hidden;
      card.className = hidden ? "card hidden" : "card";
      const btn = card.querySelector("button");
      btn.textContent = hidden ? "Tampilkan lagi" : "Sembunyikan";
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          await updateDoc(doc(db, "events", EVENT_ID, "photos", id), { hidden: !hidden });
        } catch (err) {
          $("listMsg").textContent = "Gagal mengubah foto: " + err.message;
        } finally {
          btn.disabled = false;
        }
      };
      return card;
    }
  </script>
</body>
</html>
